input {
  # HTTP вход: принимает JSON POST-запросы (удобно для curl и скриптов)
  http {
    port => 5000
    codec => json
  }
  # TCP вход: потоковый прием данных
  tcp {
    port => 5001
    codec => json_lines
  }
}

filter {
  mutate {
    add_field => { "pipeline_processor" => "c4-logstash" }
  }
}

output {
  # Отправка обработанных логов в Elasticsearch
  elasticsearch {
    hosts => ["http://c4-elasticsearch:9200"]
    index => "cluster-logs-%{+YYYY.MM.dd}"
  }
  # Дублирование в stdout контейнера для удобного мониторинга логов
  stdout {
    codec => rubydebug
  }
}